apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-smoke
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget", "-qO-", "http://{{ .Release.Name }}:{{ .Values.service.port }}/"]
